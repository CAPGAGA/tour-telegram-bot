version: "3.4"

services:

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
#    image: capgaga/pocketour:web-latest
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web.rule=Host(`app.localhost`)"
      - "traefik.http.services.web.loadbalancer.server.port=80"
    command: >
      bash -c '
        alembic upgrade head && \
        uvicorn api.main:app --host 0.0.0.0 --port 80 --proxy-headers --forwarded-allow-ips "*"
      '
    ports:
      - "8000:80"
    env_file:
      - .env
    volumes:
      - ./web/media:/web/media
    depends_on:
      - postgres
    networks:
      app_network:

  bot:
    build:
      context: .
      dockerfile: Dockerfile
      target: bot
#    image: capgaga/pocketour:bot-latest
    labels:
      - "traefik.enable=false"
    container_name: bot
    command: >
      bash -c '
        python bot/main.py
      '
    env_file:
      - .env
    environment:
      - API_BASE_URL=http://web/apiV1
    depends_on:
      - web
    networks:
      app_network:


  postgres:
    image: postgres:14
    container_name: postgres
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    env_file:
      - .env
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      app_network:

volumes:
  postgres_data:
  letsencrypt:

networks:
  app_network:
    driver: bridge