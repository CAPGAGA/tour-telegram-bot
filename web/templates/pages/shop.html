{% extends "base.html" %}

{% block title %}PockeTour - {{ _( "Tours Shop" ) }}{% endblock %}
{% block description %}
<meta name="description" content="{{ _('Discover and purchase unique audio tours from local experts worldwide. Browse our collection of self-guided tours for your next adventure.') }}">
<meta property="og:description" content="{{ _('Discover and purchase unique audio tours from local experts worldwide. Browse our collection of self-guided tours for your next adventure.') }}">
<meta name="twitter:description" content="{{ _('Discover and purchase unique audio tours from local experts worldwide. Browse our collection of self-guided tours for your next adventure.') }}">
{% endblock %}

{% block content %}
{% include "modules/landing/navbar.html" %}
<section class="section">
    <div class="container">
        <h1 class="title">{{ _( "Tour Store" ) }}</h1>

        <!-- Search and Filter Bar -->
        <div class="box">
            <div class="field">
                <label class="label">{{ _( "Search" ) }}</label>
                <div class="control">
                    <input class="input" type="text" id="search-input" placeholder="{{ _( 'Search for a tour...' ) }}">
                </div>
            </div>
            <button class="button is-primary" id="search-btn">{{ _( "Search" ) }}</button>
        </div>

        <!-- Tour Listing -->
        <div id="tour-list" class="columns is-multiline"></div>

        <!-- Pagination -->
        <div class="pagination">
            <button class="button is-link" id="prev-page">{{ _( "Previous" ) }}</button>
            <button class="button is-link" id="next-page">{{ _( "Next" ) }}</button>
        </div>
    </div>
</section>
{% include "modules/landing/footer.html" %}
{% endblock %}
